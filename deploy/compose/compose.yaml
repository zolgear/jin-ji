# jin-ji 開発用の Compose 定義。
# 起動: docker compose -f deploy/compose/compose.yaml up -d
# 事前に deploy/compose/.env.example を .env にコピーしてパスワードを設定すること。
name: jinji

services:
  postgres:
    # パッチ版まで固定する。更新は公開から 7 日以上経った版にする（ADR-0001）。
    image: postgres:17.10-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JINJI_PG_ADMIN_PASSWORD:?deploy/compose/.env に JINJI_PG_ADMIN_PASSWORD を設定してください}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --locale-provider=builtin --builtin-locale=C.UTF-8"
      # initdb/10-roles.sh が初回起動時にだけ使う
      JINJI_PG_OWNER_PASSWORD: ${JINJI_PG_OWNER_PASSWORD:?deploy/compose/.env に JINJI_PG_OWNER_PASSWORD を設定してください}
      JINJI_PG_APP_PASSWORD: ${JINJI_PG_APP_PASSWORD:?deploy/compose/.env に JINJI_PG_APP_PASSWORD を設定してください}
    ports:
      # ホストのループバックにだけ公開する
      - "127.0.0.1:${JINJI_PG_HOST_PORT:-25432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jinji"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
    name: jinji_pgdata
